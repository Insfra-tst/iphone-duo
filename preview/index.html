<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iPhone Duo Preview</title>
  <style>
    :root{color-scheme:dark;font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07090e;color:#f4f6fb;display:grid;place-items:center;padding:18px}
    .shell{width:min(920px,100%)}header{display:flex;align-items:center;gap:14px;margin-bottom:12px}h1{margin:0;font-size:26px;letter-spacing:.22em}header small{display:block;color:#778092;font-size:9px;letter-spacing:.16em;margin-top:3px}.tools{margin-left:auto;display:flex;gap:8px}button,select{font:inherit;color:inherit;background:#151b26;border:1px solid #313a4c;border-radius:10px;padding:9px 11px;cursor:pointer}button:hover,select:hover{border-color:#27cae5}
    .picker{width:100%;margin-bottom:12px;background:#151b26;color:#aeb7c7;border:1px solid #313a4c;border-radius:9px;padding:8px}.screens{display:flex;gap:7px;min-height:540px;transition:.25s;--fold:0deg}.screens.stack{flex-direction:column}.panel{flex:1;min-width:0;background:#131923;border:3px solid #232d3e;border-radius:29px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 14px 36px #0008;position:relative;transition:transform .12s ease}.panel:before{content:"";position:absolute;z-index:3;top:8px;left:50%;width:74px;height:19px;transform:translateX(-50%);border-radius:20px;background:#05070b;box-shadow:0 1px 0 #ffffff18;pointer-events:none}.screens:not(.stack) .panel:nth-child(3){transform:perspective(900px) rotateY(var(--fold));transform-origin:left center}.screens.stack .panel:nth-child(3){transform:perspective(900px) rotateX(calc(var(--fold) * -1));transform-origin:top center}.panel.folded{display:none}.bar{height:51px;padding:7px 13px 0;display:flex;align-items:center;gap:7px;border-bottom:1px solid #283141;color:#aeb7c7;font-size:10px;letter-spacing:.12em}.dot{width:7px;height:7px;border-radius:50%;background:#18cbe5}.panel:nth-child(3) .dot{background:#a979f4}.bar select{margin-left:auto;padding:6px 8px;font-size:12px}.content{flex:1;padding:17px;overflow:auto}.home h2{font-size:29px;line-height:1;margin:0 0 5px}.muted{color:#7f8a9e;font-size:12px}.app{display:flex;align-items:center;gap:10px;padding:12px;margin-top:14px;background:#ffffff09;border-radius:14px;border:1px solid #ffffff0a;text-align:left;width:100%}.app b{font-size:14px}.app span{font-size:21px}.app em{margin-left:auto;color:#7f8a9e;font-style:normal;font-size:22px}.cyan{color:#18cbe5}.yellow{color:#ffd75a}.orange{color:#ffad42}.mint{color:#60e8c2}.notes{display:flex;flex-direction:column;height:100%}.notes textarea{flex:1;min-height:360px;resize:none;background:#0d121a;color:#f4f6fb;border:1px solid #293446;border-radius:12px;margin-top:12px;padding:12px;font:inherit}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.display{grid-column:1/-1;text-align:right;font-size:35px;min-height:62px;padding:10px 4px;overflow:hidden;white-space:nowrap}.calc button{min-height:48px;font-size:18px}.op{background:#dc862f}.clock{text-align:center;padding-top:40px}.clock .time{font-size:40px;font-weight:300;margin:18px 0 7px}.clock .globe{font-size:38px;color:#60e8c2}.homebtn{border:0;border-top:1px solid #283141;border-radius:0;background:transparent;color:#aeb7c7;width:100%;padding:10px}.hinge{width:8px;border-radius:99px;background:linear-gradient(90deg,#10151e,#9ca7b7,#10151e);align-self:center;min-height:90px;cursor:ew-resize;box-shadow:0 0 0 1px #000,0 0 12px #7f8a9e88}.screens.stack .hinge{width:90px;height:8px;min-height:8px;cursor:ns-resize}.hint{text-align:center;color:#687387;margin:11px 0 0;font-size:12px}
    @media(max-width:620px){body{padding:10px}.screens{min-height:560px}.screens:not(.stack){flex-direction:column}.screens:not(.stack) .hinge{width:64px;height:5px;min-height:5px}.screens:not(.stack) .panel{min-height:420px}header{align-items:flex-start}.tools{flex-direction:column}}
    /* Light Duo hardware theme */
    body{background:linear-gradient(145deg,#f7f9fc,#e7edf7);color:#172033}
    h1{color:#18243a}.picker,button,select{background:#fff;color:#172033;border-color:#d6deeb;box-shadow:0 2px 8px #aab6c620}
    .panel{background:#fff;border:5px solid #d4dbe6;border-radius:38px;box-shadow:inset 0 0 0 1px #fff,0 18px 42px #71819b45}.panel:before{background:#101624;box-shadow:0 1px 0 #fff4;top:10px;width:76px;height:20px}
    .bar{border-color:#e6ebf2;color:#647084;display:none}.content{color:#172033}.muted{color:#718096}.app{background:#f5f7fb;border-color:#e7ebf2}.homebtn{border-color:#e6ebf2;color:#526176}.hint{color:#738097}
    .hinge{position:relative;background:linear-gradient(90deg,#919cac,#fefefe,#919cac);box-shadow:0 0 0 1px #8995a7,0 0 14px #8090aa88;display:grid;place-items:center;color:#4c596c;font-size:13px;font-weight:800;user-select:none}.hinge:after{content:"‹›";position:absolute;background:#fff;border:1px solid #aab4c3;border-radius:99px;padding:3px 7px;box-shadow:0 2px 8px #65728a40}.screens.stack .hinge{background:linear-gradient(#919cac,#fefefe,#919cac)}.screens.stack .hinge:after{content:"⌃⌄"}
    .notes textarea{background:#f8fafc;color:#172033;border-color:#d8e0eb}.calc button{background:#edf2f8;color:#172033}.calc .op{background:#ff9e3d;color:#fff}.display{color:#172033}.home{min-height:100%;margin:-17px;padding:17px;background:radial-gradient(circle at 20% 12%,#c8f0ff 0 18%,transparent 40%),radial-gradient(circle at 82% 58%,#e4c9ff 0 22%,transparent 48%),linear-gradient(145deg,#eefbff,#eff0ff)}.status{display:flex;justify-content:space-between;font-size:11px;font-weight:700;padding:0 4px 23px}.status span{font-size:10px;letter-spacing:2px}.wallpaper-title{text-align:center;color:#63718a;font-size:12px;font-weight:600;margin-bottom:17px}.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px 8px}.icon-grid .app{display:flex;flex-direction:column;gap:5px;padding:0;background:transparent;border:0;box-shadow:none;margin:0}.icon-grid .app span,.dock span{display:grid;place-items:center;width:48px;height:48px;border-radius:13px;color:#fff;font-size:25px;box-shadow:0 3px 8px #62708a40}.icon-grid .app b{font-size:9px;font-weight:600;color:#39455a}.messages span{background:#35c759}.safari span{background:linear-gradient(145deg,#2c8cff,#4dd6ff)}.photos span{background:linear-gradient(135deg,#ff6161,#a868ff,#4bb9ff)}.camera span{background:#485568}.music span{background:linear-gradient(145deg,#ff436e,#ff9e35)}.notes span{background:#ffd84d;color:#62501c}.calculator span{background:#303b4a}.clock span{background:#303b4a}.dock{display:flex;justify-content:space-around;margin-top:34px;padding:10px;border:1px solid #fff9;border-radius:22px;background:#ffffff80;backdrop-filter:blur(18px);box-shadow:0 8px 25px #7282a42a}.dock span:nth-child(1){background:#35c759}.dock span:nth-child(2){background:#2d8cff}.dock span:nth-child(3){background:#ff4d76}.demo{text-align:center;padding-top:60px}.demo-icon{margin:auto;display:grid;place-items:center;width:86px;height:86px;border-radius:24px;background:#3c8df5;color:#fff;font-size:45px;box-shadow:0 8px 20px #5579ad40}.demo h2{margin-bottom:5px}
  </style>
</head>
<body>
<main class="shell"><div class="screens" id="screens"></div></main>
<script>
const state=[{app:'Home',note:localStorage.duoNote1||'',value:'0'},{app:'Home',note:localStorage.duoNote2||'',value:'0'}];let folded=false;
const apps=['Home','Messages','Safari','Photos','Camera','Music','Notes','Calculator','Clock']; const icons={Home:'▦',Messages:'●',Safari:'◉',Photos:'✿',Camera:'◌',Music:'♫',Notes:'▤',Calculator:'＋',Clock:'◷'};
function panel(i){let s=state[i], el=document.createElement('section');el.className='panel'+(i===1&&folded?' folded':'');el.innerHTML=`<div class="bar"><i class="dot"></i>SCREEN ${i+1}<select>${apps.map(a=>`<option ${a===s.app?'selected':''}>${a}</option>`).join('')}</select></div><div class="content"></div><button class="homebtn">⌂ Home</button>`;let select=el.querySelector('select');select.onchange=()=>{s.app=select.value;render()};el.querySelector('.homebtn').onclick=()=>{s.app='Home';render()};let c=el.querySelector('.content');
if(s.app==='Home')c.innerHTML='<div class="home"><div class="status">9:41 <span>▮▮▮ ᯤ ▰</span></div><div class="wallpaper-title">'+(i?'Duo Space':'Duo Home')+'</div><div class="icon-grid">'+['Messages','Safari','Photos','Camera','Music','Notes','Calculator','Clock'].map(a=>`<button class="app ${a.toLowerCase()}" data-app="${a}"><span>${icons[a]||({Messages:'●',Safari:'◉',Photos:'✿',Camera:'◌',Music:'♫'}[a])}</span><b>${a}</b></button>`).join('')+'</div><div class="dock"><span>☎</span><span>◉</span><span>♫</span></div></div>';else if(s.app==='Messages'||s.app==='Safari'||s.app==='Photos'||s.app==='Camera'||s.app==='Music'){c.innerHTML='<div class="demo"><div class="demo-icon">'+(icons[s.app]||'●')+'</div><h2>'+s.app+'</h2><p class="muted">This Duo panel is ready for '+s.app+'.</p></div>'}else if(s.app==='Notes'){c.innerHTML=`<div class="notes"><b>Notes</b><span class="muted">Saved locally</span><textarea placeholder="A little space for your ideas…">${s.note}</textarea></div>`;c.querySelector('textarea').oninput=e=>{s.note=e.target.value;localStorage['duoNote'+(i+1)]=s.note}}else if(s.app==='Calculator'){c.innerHTML='<div class="calc"><div class="display">'+s.value+'</div>'+['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(k=>`<button class="${'+−×÷='.includes(k)?'op':''}" data-k="${k}">${k}</button>`).join('')+'</div>';c.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>calc(s,b.dataset.k,el))}else c.innerHTML='<div class="clock"><div class="globe">◎</div><div class="time">'+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div><div class="muted">'+new Date().toLocaleDateString([], {dateStyle:'full'})+'</div><p class="mint">'+Intl.DateTimeFormat().resolvedOptions().timeZone.replace('_',' ')+'</p><span class="muted">A moment to breathe.</span></div>';
 c.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>{s.app=b.dataset.app;render()});return el}
function calc(s,k,el){let d=s.value;if(k==='AC')d='0';else if(k==='⌫')d=d.length>1?d.slice(0,-1):'0';else if(k==='±')d=d.startsWith('-')?d.slice(1):'-'+d;else if(k==='='){try{d=String(Function('return '+d.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-'))())}catch{d='Error'}}else if(k==='.'&&!d.includes('.'))d+='.';else if('+-×÷'.includes(k))d+=k;else d=d==='0'?k:d+k;s.value=d;render()}
let angle=0;function render(){let screens=document.querySelector('#screens');let stack=window.innerWidth<=620;screens.className='screens '+(stack?'stack':'');screens.style.setProperty('--fold',angle+'deg');screens.innerHTML='';screens.append(panel(0));let hinge=document.createElement('div');hinge.className='hinge';hinge.title='Tap or drag to fold and unfold';screens.append(hinge);screens.append(panel(1));let dragging=false,moved=false;hinge.onpointerdown=e=>{dragging=true;moved=false;hinge.setPointerCapture(e.pointerId)};hinge.onpointermove=e=>{if(!dragging)return;moved=true;let rect=hinge.getBoundingClientRect();let distance=stack?e.clientY-rect.top:e.clientX-rect.left;angle=Math.max(0,Math.min(65,distance*1.5));screens.style.setProperty('--fold',angle+'deg')};hinge.onpointerup=()=>{dragging=false;if(!moved){angle=angle<30?65:0;screens.style.setProperty('--fold',angle+'deg')}}};render();setInterval(()=>{if(state.some(s=>s.app==='Clock'))render()},1000);
</script>
</body></html>
