name: AIMobileOS
options:
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  AIMobileOS:
    type: application
    platform: iOS
    sources:
      - path: MobileOS
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: AI Mobile OS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: com.insfratst.aimobileos
        PRODUCT_NAME: AIMobileOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
schemes:
  AIMobileOS:
    build:
      targets:
        AIMobileOS: all
